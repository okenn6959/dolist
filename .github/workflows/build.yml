name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 준비
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 웹 폴더 구성
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: 패키지 설치
        run: npm install

      - name: 안드로이드 프로젝트 생성
        run: npx cap add android

      - name: 알림 권한 추가
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application|' $M
          grep uses-permission $M

      - name: 위젯 파일 생성
        run: |
          chmod +x widget.sh
          bash widget.sh

      - name: 아이콘 적용
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: 서명키 확인 및 설정
        run: |
          if [ ! -f debug.keystore ]; then
            echo "::error::debug.keystore 파일이 저장소 최상위에 없습니다."
            exit 1
          fi
          echo "keystore 크기: $(wc -c < debug.keystore) bytes"
          keytool -list -keystore debug.keystore -storepass android | head -5

          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          block = """
              signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          """
          if 'signingConfigs' not in s:
              i = s.index('android {') + len('android {')
              s = s[:i] + block + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
              print('서명 설정 주입 완료')
          else:
              print('이미 서명 설정 있음')
          PY

      - name: 버전 번호 올리기
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName .*/versionName \"1.0.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName|storeFile" $G

      - name: APK 빌드
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 서명 지문 확인
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "===== 이 APK 의 서명 지문 ====="
          keytool -printcert -jarfile $APK | grep -A1 "SHA256" | head -4 || echo "지문을 읽지 못했습니다"

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: dolist-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
