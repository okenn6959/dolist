<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F4">
<title>할일관리</title>
<style>
  :root {
    --ink: #14171C;
    --ink-soft: #5A626E;
    --ink-faint: #8E96A2;
    --line: #D6DAE0;
    --line-soft: #E6E9ED;
    --paper: #F5F6F4;
    --card: #FFFFFF;
    --stamp: #B3261E;
    --done: #2E6B5E;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", "DejaVu Sans Mono", monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--paper);
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }

  .tp-wrap {
    font-family: var(--sans);
    color: var(--ink);
    max-width: 620px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 44px);
    -webkit-font-smoothing: antialiased;
  }

  .tp-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .tp-date {
    display: block;
    font-family: var(--sans);
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 6px 0 0;
    padding: 0;
    line-height: 1.15;
    text-align: left;
    background: none;
    border: 0;
    color: var(--ink);
    cursor: pointer;
  }
  .tp-date span { color: var(--ink-faint); font-weight: 500; }

  .tp-stat {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 7px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tp-stat b { color: var(--ink); font-weight: 700; }
  .tp-stat .late { color: var(--stamp); }

  .tp-rule { height: 1px; background: var(--line); margin: 18px 0 14px; border: 0; }

  .tp-open {
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .tp-open:active { transform: translateY(1px); }

  .tp-form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    display: none;
  }
  .tp-form.on { display: block; }

  .tp-field { margin-bottom: 11px; }
  .tp-label {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }
  .tp-form textarea {
    width: 100%;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px;
    min-height: 72px;
    resize: vertical;
  }
  .tp-form input[type="text"], .tp-form input[type="date"] {
    width: 100%;
    font-family: var(--sans);
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }

  .tp-seg { display: flex; gap: 6px; }
  .tp-seg button {
    flex: 1;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tp-seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tp-seg button[data-p="A"][aria-pressed="true"] { background: var(--stamp); border-color: var(--stamp); }
  .tp-seg .hint { display: block; font-family: var(--sans); font-size: 10px; font-weight: 500; opacity: .75; }

  .tp-row2 { display: flex; gap: 10px; }
  .tp-row2 > * { flex: 1; }

  .tp-submit {
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 13px;
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 3px;
  }
  .tp-cancel {
    width: 100%;
    background: none;
    border: 0;
    color: var(--ink-faint);
    font-family: var(--sans);
    font-size: 13px;
    padding: 10px;
    cursor: pointer;
  }

  .tp-del-edit {
    display: none;
    width: 100%;
    background: none;
    border: 0;
    color: var(--stamp);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
  }
  .tp-del-edit.on { display: block; }

  .tp-rep-box { display: none; margin-bottom: 11px; }
  .tp-rep-box.on { display: block; }
  .tp-inline {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    color: var(--ink);
    flex-wrap: wrap;
  }
  .tp-inline input[type="number"] {
    width: 66px;
    font-family: var(--mono);
    font-size: 15px;
    text-align: center;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 4px;
  }
  .tp-inline select {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 6px;
  }
  .tp-dows { display: flex; gap: 4px; margin-top: 9px; }
  .tp-dows label {
    position: relative;
    flex: 1;
    text-align: center;
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 0;
    cursor: pointer;
    user-select: none;
  }
  .tp-dows input { position: absolute; opacity: 0; pointer-events: none; }
  .tp-dows label.sel { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tp-mode { display: flex; gap: 6px; margin: 10px 0; }
  .tp-mode button {
    flex: 1;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tp-mode button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tp-rep-note {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    color: var(--ink-faint);
    margin: 4px 0 11px;
  }
  .tp-rep-note b { color: var(--ink-soft); font-weight: 700; }
  .tp-routine-msg {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    background: #EDF1F5;
    border-radius: 8px;
    padding: 10px 11px;
    margin-bottom: 11px;
    display: none;
  }
  .tp-routine-msg.on { display: block; }

  .tp-tabs { display: flex; gap: 15px; border-bottom: 1px solid var(--line); margin: 20px 0 4px; }
  .tp-tab {
    background: none;
    border: 0;
    padding: 0 0 9px;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-faint);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tp-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .tp-tab .n { font-family: var(--mono); font-size: 11.5px; font-weight: 500; opacity: .7; margin-left: 4px; }

  .tp-task {
    display: flex;
    gap: 12px;
    padding: 15px 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .tp-stamp {
    flex: 0 0 auto;
    width: 35px; height: 35px;
    margin-top: 1px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 4px;
    background: none;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transform: rotate(-6deg);
    transition: transform .12s ease;
  }
  .tp-stamp:active { transform: rotate(-6deg) scale(.93); }
  .tp-task[data-p="A"] .tp-stamp { border-color: var(--stamp); color: var(--stamp); border-width: 2px; }
  .tp-task.is-done .tp-stamp { border-color: var(--done); color: var(--done); }

  .tp-body { flex: 1; min-width: 0; }
  .tp-title {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--sans);
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.45;
    margin: 0;
    padding: 0;
    background: none;
    border: 0;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
    cursor: pointer;
  }
  .tp-task.is-done .tp-title { color: var(--ink-faint); text-decoration: line-through; text-decoration-thickness: 1px; }

  .tp-meta {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-top: 5px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tp-meta .late { color: var(--stamp); font-weight: 700; }

  .tp-bar { height: 5px; background: var(--line-soft); border-radius: 3px; margin-top: 9px; overflow: hidden; }
  .tp-bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width .2s ease; }
  .tp-task.is-done .tp-bar i { background: var(--done); }

  .tp-acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tp-acts button {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .tp-acts button[data-act="done"] { color: var(--done); border-color: #BFD8D2; }
  .tp-acts button[data-act="del"] { color: var(--stamp); border-color: #E8C9C6; }

  .tp-notes { list-style: none; margin: 10px 0 0; padding: 0 0 0 11px; border-left: 2px solid var(--line-soft); }
  .tp-notes li { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 5px; }
  .tp-notes time { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-right: 6px; }

  .tp-noteform { display: flex; gap: 6px; margin-top: 9px; }
  .tp-noteform input {
    flex: 1;
    font-family: var(--sans);
    font-size: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 10px;
    color: var(--ink);
  }
  .tp-noteform button {
    background: var(--ink); color: #fff; border: 0; border-radius: 7px;
    padding: 0 15px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .tp-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.6;
  }
  .tp-empty strong { display: block; color: var(--ink); font-size: 15.5px; margin-bottom: 5px; }

  .tp-foot { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tp-foot button {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 11px;
    cursor: pointer;
  }

  .tp-today-btn {
    display: none;
    margin-top: 9px;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .tp-today-btn.on { display: inline-block; }

  .tp-cell .dots { display: flex; gap: 3px; height: 5px; align-items: center; justify-content: center; }
  .tp-cell .dots i { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--ink-faint); }
  .tp-cell.has-a .dots i:first-child { background: var(--stamp); }
  .tp-cell.is-sel .dots i { background: rgba(255,255,255,.85); }

  .tp-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0 12px;
    touch-action: pan-y;
  }
  .tp-strip .arw {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 16px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tp-strip .mid { flex: 1; min-width: 0; text-align: center; }
  .tp-strip .big { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .tp-strip .rel {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 3px;
    letter-spacing: 0.04em;
  }

  .tp-swipe-hint {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-faint);
    text-align: center;
    padding-bottom: 10px;
    letter-spacing: 0.04em;
  }

  .tp-tbl { border-top: 1px solid var(--line); }
  .tp-thead, .tp-tr {
    display: grid;
    grid-template-columns: 50px 1fr 78px;
    align-items: center;
  }
  .tp-thead {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--line);
    background: #ECEEF0;
  }
  .tp-thead span { padding: 7px 6px; text-align: center; }
  .tp-thead span:nth-child(2) { text-align: left; padding-left: 10px; }

  .tp-tr {
    width: 100%;
    background: var(--card);
    border: 0;
    border-bottom: 1px solid var(--line-soft);
    padding: 0;
    text-align: left;
  }
  .tp-tr > * {
    padding: 11px 6px;
    background: none;
    border: 0;
    font-family: var(--sans);
    cursor: pointer;
    align-self: stretch;
  }
  .tp-tr .pr {
    text-align: center;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .tp-tr[data-prio="A"] .pr { color: var(--stamp); }
  .tp-tr .ct {
    padding-left: 10px;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .tp-tr .ct em {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    font-style: normal;
    font-weight: 500;
    color: var(--ink-faint);
    margin-top: 3px;
  }
  .tp-tr.is-done .ct { color: var(--ink-faint); text-decoration: line-through; }
  .tp-tr .st { text-align: center; display: flex; align-items: center; justify-content: center; }
  .tp-chip {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    padding: 5px 7px;
    border-radius: 5px;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    background: var(--paper);
    white-space: nowrap;
  }
  .tp-chip.done { color: var(--done); border-color: #BFD8D2; }
  .tp-chip.late { color: var(--stamp); border-color: #E8C9C6; }
  .tp-chip.prog { color: var(--ink); }
  .tp-chip.dele { color: #4A5AA8; border-color: #C6CCE8; }
  .tp-chip.canc { color: var(--ink-faint); }
  .tp-chip.post { color: #8A5A12; border-color: #E3D3B4; }

  .tp-page-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 0 14px;
  }
  .tp-page-bar button {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 13px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
  }
  .tp-page-bar strong { font-size: 16px; font-weight: 700; }

  .tp-outcome { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .tp-outcome button {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .tp-outcome button[data-o="done"] { color: var(--done); border-color: #BFD8D2; }
  .tp-outcome button[data-o="cancel"] { color: var(--stamp); border-color: #E8C9C6; }

  .tp-postpone { display: flex; gap: 6px; margin-top: 9px; align-items: center; }
  .tp-postpone input {
    flex: 1;
    font-family: var(--sans);
    font-size: 15px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 9px 10px;
    color: var(--ink);
  }
  .tp-postpone button {
    background: var(--ink); color: #fff; border: 0; border-radius: 7px;
    padding: 0 15px; font-size: 13px; font-weight: 600; cursor: pointer; height: 38px;
  }

  .tp-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 23, 28, .58);
    z-index: 60;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }
  .tp-modal.on { display: flex; }
  .tp-modal-card {
    background: var(--card);
    border-radius: 15px;
    padding: 20px 18px 14px;
    max-width: 360px;
    width: 100%;
  }
  .tp-modal-card h2 { margin: 0 0 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .tp-modal-card p { margin: 0 0 15px; font-size: 13.5px; line-height: 1.6; color: var(--ink-soft); }
  .tp-modal-card .prim {
    width: 100%; background: var(--ink); color: #fff; border: 0; border-radius: 9px;
    padding: 13px; font-family: var(--sans); font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  .tp-modal-card .sec {
    width: 100%; background: var(--card); color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 9px; padding: 12px;
    font-family: var(--sans); font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  .tp-modal-card .ghost {
    width: 100%; background: none; border: 0; color: var(--ink-faint);
    font-family: var(--sans); font-size: 13px; padding: 11px; cursor: pointer; margin-top: 4px;
  }

  .tp-bk { display: none; margin-top: 12px; }
  .tp-bk.on { display: block; }
  .tp-bk-file {
    display: block;
    width: 100%;
    font-family: var(--sans);
    font-size: 13.5px;
    color: var(--ink);
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 9px;
    padding: 12px 10px;
    margin-bottom: 8px;
  }
  .tp-bk-file::file-selector-button {
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    background: var(--ink); color: #fff; border: 0; border-radius: 7px;
    padding: 9px 12px; margin-right: 10px;
  }
  .tp-bk-res {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px;
    margin-bottom: 8px;
    word-break: break-all;
  }
  .tp-bk-res b { color: var(--done); }
  .tp-bk-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tp-bk-row button {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    background: var(--card); border: 1px solid var(--line); border-radius: 7px;
    padding: 9px 12px; color: var(--ink-soft); cursor: pointer;
  }
  .tp-bk-row button.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tp-bk-row button.danger { color: var(--stamp); border-color: #E8C9C6; }
  .tp-bk-note {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint);
    line-height: 1.6; margin-top: 8px;
  }
  .tp-stat .hint { color: var(--ink-faint); opacity: .85; }

  .tp-banner {
    background: #FBF0EF;

<script>
(function () {
  var KEY = 'dolist.tasks.v1';
  var OWNER = 'dolist.owner';
  var state = { tasks: [], closeOpen: null, postponeOpen: null, page: null, editFrom: 'main', tab: 'day', date: null, calMonth: null, prio: 'A', noteOpen: null, editId: null };

  var el = function (id) { return document.getElementById(id); };
  var banner = el('tp-banner');

  function warn(msg) { banner.textContent = msg; banner.classList.add('on'); }
  function clearWarn() { banner.classList.remove('on', 'ok'); banner.textContent = ''; }

  function clearError() { if (!banner.classList.contains('ok')) clearWarn(); }

  var infoTimer = null;
  function info(msg) {
    banner.textContent = msg;
    banner.classList.add('on', 'ok');
    if (infoTimer) clearTimeout(infoTimer);
    infoTimer = setTimeout(clearWarn, 5000);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function dayDiff(iso) {
    if (!iso) return 0;
    return Math.round((new Date(todayISO() + 'T00:00:00') - new Date(iso + 'T00:00:00')) / 86400000);
  }

  function addMonth(ym, delta) {
    var y = Number(ym.split('-')[0]), m = Number(ym.split('-')[1]) + delta;
    y += Math.floor((m - 1) / 12);
    m = ((m - 1) % 12 + 12) % 12 + 1;
    return y + '-' + String(m).padStart(2, '0');
  }

  function lateDays(t) {
    if (t.done || !t.due) return 0;
    var d = dayDiff(t.due);
    return d > 0 ? d : 0;
  }

  /* ================= 반복(루틴) 엔진 ================= */

  var RKEY = 'dolist.rules.v1';
  var HORIZON = 60;          // 며칠 앞까지 미리 만들어 둘지
  var GEN_CAP = 120;         // 한 번에 만들 최대 개수
  var rules = [];
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];

  function isoToDate(iso) { return new Date(iso + 'T00:00:00'); }
  function dateToISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  function addDaysISO(iso, n) { var d = isoToDate(iso); d.setDate(d.getDate() + n); return dateToISO(d); }
  function daysBetween(a, b) { return Math.round((isoToDate(b) - isoToDate(a)) / 86400000); }
  function lastDayOfMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  function nthWeekdayISO(y, m, nth, wd) {
    var last = lastDayOfMonth(y, m), day;
    if (nth >= 5) {
      for (day = last; day >= 1; day--) if (new Date(y, m, day).getDay() === wd) return dateToISO(new Date(y, m, day));
      return null;
    }
    var first = new Date(y, m, 1).getDay();
    day = 1 + ((wd - first + 7) % 7) + (nth - 1) * 7;
    return day > last ? null : dateToISO(new Date(y, m, day));
  }

  function occurrences(r, fromISO, toISO, cap) {
    var out = [], guard = 0;
    cap = cap || GEN_CAP;
    if (!r || !r.start || fromISO > toISO) return out;

    if (r.freq === 'day') {
      var n = Math.max(1, Number(r.n) || 1);
      var cur = r.start, gap = daysBetween(r.start, fromISO);
      if (gap > 0) cur = addDaysISO(r.start, Math.ceil(gap / n) * n);
      while (cur <= toISO && out.length < cap && guard++ < 3000) {
        if (cur >= fromISO) out.push(cur);
        cur = addDaysISO(cur, n);
      }

    } else if (r.freq === 'week') {
      var nw = Math.max(1, Number(r.n) || 1);
      var wds = (r.weekdays && r.weekdays.length) ? r.weekdays.slice() : [isoToDate(r.start).getDay()];
      var weekStart = addDaysISO(r.start, -isoToDate(r.start).getDay());
      var w = weekStart, wGap = Math.floor(daysBetween(weekStart, fromISO) / 7);
      if (wGap > 0) w = addDaysISO(weekStart, Math.floor(wGap / nw) * nw * 7);
      while (w <= toISO && out.length < cap && guard++ < 3000) {
        for (var i = 0; i < 7; i++) {
          if (wds.indexOf(i) < 0) continue;
          var dt = addDaysISO(w, i);
          if (dt >= fromISO && dt >= r.start && dt <= toISO) out.push(dt);
        }
        w = addDaysISO(w, nw * 7);
      }
      out.sort();

    } else if (r.freq === 'month') {
      var nm = Math.max(1, Number(r.n) || 1);
      var sd = isoToDate(r.start), y = sd.getFullYear(), m = sd.getMonth();
      while (guard++ < 800 && out.length < cap) {
        var iso = r.monthMode === 'nth'
          ? nthWeekdayISO(y, m, Number(r.nth) || 1, Number(r.nwd) || 0)
          : dateToISO(new Date(y, m, Math.min(Number(r.monthDay) || sd.getDate(), lastDayOfMonth(y, m))));
        if (iso) {
          if (iso > toISO) break;
          if (iso >= fromISO && iso >= r.start) out.push(iso);
        }
        m += nm;
        while (m > 11) { m -= 12; y++; }
      }
    }
    return out;
  }

  function ruleText(r) {
    if (!r || r.freq === 'none') return '';
    var n = Math.max(1, Number(r.n) || 1);
    if (r.freq === 'day') return n === 1 ? '매일' : n + '일마다';
    if (r.freq === 'week') {
      var wd = (r.weekdays || []).slice().sort().map(function (i) { return DOW[i]; }).join('·');
      return (n === 1 ? '매주' : n + '주마다') + (wd ? ' ' + wd : '');
    }
    var per = n === 1 ? '매월' : n + '개월마다';
    if (r.monthMode === 'nth') {
      var idx = ['', '첫째', '둘째', '셋째', '넷째', '마지막'][Math.min(5, Number(r.nth) || 1)];
      return per + ' ' + idx + ' ' + DOW[Number(r.nwd) || 0] + '요일';
    }
    return per + ' ' + (Number(r.monthDay) || 1) + '일';
  }

  function loadRules() {
    try {
      var v = JSON.parse(localStorage.getItem(RKEY));
      rules = Array.isArray(v) ? v : [];
    } catch (e) { rules = []; }
  }

  function saveRules() {
    try { localStorage.setItem(RKEY, JSON.stringify(rules)); } catch (e) {}
  }

  function findRule(id) {
    for (var i = 0; i < rules.length; i++) if (rules[i].id === id) return rules[i];
    return null;
  }

  function nextNid() {
    var n = Number(localStorage.getItem('dolist.nid') || '1');
    localStorage.setItem('dolist.nid', String(n + 1));
    return n;
  }

  /** 규칙에 따라 앞으로의 항목을 실제로 만들어 둔다 */
  function syncRules() {
    var today = todayISO(), to = addDaysISO(today, HORIZON), made = 0;

    rules.forEach(function (r) {
      if (!r.active) return;
      var from = r.lastGen ? addDaysISO(r.lastGen, 1) : r.start;
      if (from > to) return;

      var dates = occurrences(r, from, to);
      var seen = {};
      state.tasks.forEach(function (t) { if (t.rid === r.id) seen[t.on] = true; });

      dates.forEach(function (d) {
        if (seen[d]) return;
        state.tasks.push({
          id: 't' + Date.now() + Math.floor(Math.random() * 900 + 100) + made,
          title: r.title, owner: r.owner || '', prio: r.prio || 'B',
          on: d, due: d, remind: r.remind || null,
          rid: r.id, progress: 0, notes: [], done: false, createdAt: Date.now(),
          nid: nextNid()
        });
        made++;
      });

      r.lastGen = to;
    });

    if (made) { saveRules(); save(); }
    else saveRules();
    return made;
  }

  /** 규칙 중단: 앞으로의 미완료 항목을 걷어낸다 */
  function stopRule(rid) {
    var r = findRule(rid);
    if (r) { r.active = false; saveRules(); }
    var today = todayISO(), removed = 0;
    state.tasks = state.tasks.filter(function (t) {
      if (t.rid === rid && !t.done && t.on > today) { removed++; return false; }
      return true;
    });
    return removed;
  }

  function relLabel(iso) {
    var d = dayDiff(iso);
    if (d === 0) return '오늘';
    if (d === 1) return '어제';
    if (d === -1) return '내일';
    return d > 0 ? d + '일 전' : (-d) + '일 후';
  }

  function fmtDue(iso) {
    if (!iso) return '마감 없음';
    var p = iso.split('-');
    return Number(p[1]) + '월 ' + Number(p[2]) + '일';
  }

  function hhmm(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      state.tasks = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(state.tasks)) state.tasks = [];
    } catch (e) {
      state.tasks = [];
      warn('저장된 목록을 읽지 못했습니다. 새 목록으로 시작합니다.');
    }
    // 기존 데이터 이관: 표시 날짜가 없던 항목은 마감 날짜를 표시 날짜로 사용
    var moved = 0;
    state.tasks.forEach(function (t) {
      if (!t.on) { t.on = t.due || todayISO(); moved++; }
      if (!t.due) t.due = t.on;
    });
    if (moved) { try { localStorage.setItem(KEY, JSON.stringify(state.tasks)); } catch (e) {} }

    var o = localStorage.getItem(OWNER);
    if (o) el('tp-owner').value = o;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state.tasks));
      mirrorWidget();
      clearError();
    } catch (e) {
      warn('저장에 실패했습니다. 완료함을 비워 공간을 확보한 뒤 다시 시도해 주세요.');
    }
  }

  /* ---------- 로컬 알림 ---------- */

  var CAP = window.Capacitor || null;
  var LN = (CAP && CAP.Plugins && CAP.Plugins.LocalNotifications) || null;
  var PREF = (CAP && CAP.Plugins && CAP.Plugins.Preferences) || null;
  var NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform() && LN);
  function nidFor(t) {
    if (!t.nid) {
      var n = Number(localStorage.getItem('dolist.nid') || '1');
      t.nid = n;
      localStorage.setItem('dolist.nid', String(n + 1));
    }
    return t.nid;
  }

  async function askPermission() {
    if (!NATIVE) return false;
    try {
      var r = await LN.checkPermissions();
      if (r.display !== 'granted') r = await LN.requestPermissions();
      return r.display === 'granted';
    } catch (e) { return false; }
  }

  async function syncNotifications() {
    if (!NATIVE) return;
    try {
      var pending = await LN.getPending();
      var old = (pending.notifications || []).map(function (n) { return { id: n.id }; });
      if (old.length) await LN.cancel({ notifications: old });

      var list = [];
      var assigned = false;
      var limitISO = addDaysISO(todayISO(), 45), scheduled = 0;
      state.tasks.forEach(function (t) {
        if (scheduled >= 60) return;
        if (t.due && t.due > limitISO) return;
        scheduled++;
        if (t.done || !t.remind || !t.due) return;
        var at = new Date(t.due + 'T' + t.remind + ':00');
        if (isNaN(at.getTime()) || at.getTime() <= Date.now() + 10000) return;
        if (!t.nid) assigned = true;
        list.push({
          id: nidFor(t),
          title: '[' + t.prio + '] ' + t.title,
          body: (t.owner ? t.owner + ' · ' : '') + '알림 ' + fmtDue(t.due),
          schedule: { at: at, allowWhileIdle: true }
        });
      });

      if (assigned) save();
      if (list.length) await LN.schedule({ notifications: list });
      clearError();
    } catch (e) {
      warn('알림을 예약하지 못했습니다. 폰 설정에서 할일관리의 알림 권한을 확인해 주세요.');
    }
  }

  /* ---------- 홈 화면 위젯용 사본 ---------- */

  function widgetItems() {
    var today = todayISO();
    var list = state.tasks.filter(function (x) {
      if (x.done) return false;
      if (!x.on) return true;
      return x.on === today || dayDiff(x.on) > 0;
    });
    var order = { A: 0, B: 1, C: 2 };
    list.sort(function (a, b) {
      var la = a.on ? dayDiff(a.on) : 0, lb = b.on ? dayDiff(b.on) : 0;
      if ((la > 0) !== (lb > 0)) return la > 0 ? -1 : 1;
      if (order[a.prio] !== order[b.prio]) return order[a.prio] - order[b.prio];
      return (a.on || '9999').localeCompare(b.on || '9999');
    });
    return list;
  }

  function mirrorWidget() {
    if (!PREF) return;

    var today = todayISO();
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    var d = new Date();
    var order = { A: 0, B: 1, C: 2 };

    function flat(t) { return String(t.title || '').replace(/\s+/g, ' ').trim(); }
    function byPrio(a, b) {
      if (order[a.prio] !== order[b.prio]) return order[a.prio] - order[b.prio];
      return (a.on || '9999').localeCompare(b.on || '9999');
    }

    var open = state.tasks.filter(function (x) { return !x.done; });

    var todayList = open.filter(function (t) {
      return !t.on || t.on === today || dayDiff(t.on) > 0;
    }).sort(function (a, b) {
      var la = lateDays(a), lb = lateDays(b);
      if ((la > 0) !== (lb > 0)) return la > 0 ? -1 : 1;
      return byPrio(a, b);
    });

    var nextList = open.filter(function (t) {
      if (!t.on) return false;
      var ahead = -dayDiff(t.on);
      return ahead >= 1 && ahead <= 7;
    }).sort(function (a, b) {
      return (a.on || '').localeCompare(b.on || '') || byPrio(a, b);
    });

    var late = todayList.filter(function (t) { return lateDays(t) > 0; }).length;

    function shortDate(iso) {
      var p = iso.split('-');
      return Number(p[1]) + '/' + Number(p[2]);
    }

    var payload = {
      head: (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()] + '요일',
      sub: '오늘 ' + todayList.length + '건 · 차주 ' + nextList.length + '건' +
        (late ? ' · 지연 ' + late : ''),
      today: todayList.slice(0, 4).map(function (t) {
        return {
          p: t.prio,
          t: flat(t),
          d: lateDays(t) > 0 ? lateDays(t) + '일 지연' : '오늘'
        };
      }),
      next: nextList.slice(0, 4).map(function (t) {
        return { p: t.prio, t: flat(t), d: shortDate(t.on) };
      })
    };

    try { PREF.set({ key: 'widget_today', value: JSON.stringify(payload) }); } catch (e) {}
  }

  function header() {
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    var iso = state.date;
    var d = new Date(iso + 'T00:00:00');
    var isToday = iso === todayISO();

    el('tp-date').innerHTML = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 <span>' +
      days[d.getDay()] + '요일' + (isToday ? '' : ' · ' + relLabel(iso)) + '</span>';
    el('tp-today-btn').className = 'tp-today-btn' + (isToday ? '' : ' on');

    var open = state.tasks.filter(function (t) { return !t.done; });
    var late = open.filter(function (t) { return lateDays(t) > 0; });
    var dayN = dayList().length;

    var s = '<span>이 날 <b>' + dayN + '</b></span><span>남은 일 <b>' + open.length + '</b></span>';
    if (late.length) s += '<span class="late">지연 ' + late.length + '</span>';
    if (state.tab === 'day') s += '<span class="hint">날짜 좌우 스와이프</span>';
    el('tp-stat').innerHTML = s;

    el('n-day').textContent = dayN || '';
    el('n-all').textContent = open.length || '';
    el('n-done').textContent = (state.tasks.length - open.length) || '';
  }

  function dayList() {
    var iso = state.date, isToday = iso === todayISO();
    return state.tasks.filter(function (x) {
      if (x.done) return false;
      if (!x.on) return isToday;
      return x.on === iso || (isToday && dayDiff(x.on) > 0);
    });
  }

  function visible() {
    var t = state.tab;
    var list = t === 'day' ? dayList() : state.tasks.filter(function (x) {
      if (t === 'done') return x.done;
      return !x.done;
    });
    var order = { A: 0, B: 1, C: 2 };
    list.sort(function (a, b) {
      if (t === 'done') return (b.doneAt || 0) - (a.doneAt || 0);
      var la = lateDays(a), lb = lateDays(b);
      if ((la > 0) !== (lb > 0)) return la > 0 ? -1 : 1;
      if (order[a.prio] !== order[b.prio]) return order[a.prio] - order[b.prio];
      return (a.on || '9999').localeCompare(b.on || '9999');
    });
    return list;
  }

  function emptyCopy() {
    if (state.tab === 'done') return '<strong>완료함이 비어 있습니다</strong>끝낸 일에 완료를 누르면 여기로 옮겨집니다.';
    if (state.tab === 'day') {
      return state.date === todayISO()
        ? '<strong>오늘 처리할 일이 없습니다</strong>위에서 할 일을 하나 넣어보세요.'
        : '<strong>이 날에는 할 일이 없습니다</strong>추가하면 이 날짜로 들어갑니다.';
    }
    return '<strong>목록이 비어 있습니다</strong>위에서 할 일을 하나 넣어보세요.';
  }

  function taskHTML(t) {
    var late = lateDays(t) > 0;
    var meta = [];
    if (t.owner) meta.push('<span>' + esc(t.owner) + '</span>');
    meta.push('<span>' + esc(fmtDue(t.on)) + '</span>');
    if (late) meta.push('<span class="late">' + lateDays(t) + '일 지연</span>');
    if (t.rid) meta.push('<span>\u21BB 반복</span>');
    if (t.done) meta.push('<span>' + (t.doneAt ? hhmm(t.doneAt) + ' ' : '') + outcomeOf(t).label + '</span>');
    if (!t.done) meta.push('<span>' + (t.progress || 0) + '%</span>');
    if (!t.done && t.remind) {
      var sameDay = !t.due || t.due === t.on;
      meta.push('<span>\u23F0 ' + (sameDay ? '' : esc(fmtDue(t.due)) + ' ') + esc(t.remind) + '</span>');
    }

    var notes = '';
    if (t.notes && t.notes.length) {
      notes = '<ul class="tp-notes">' + t.notes.slice(-4).map(function (n) {
        return '<li><time>' + hhmm(n.t) + '</time>' + esc(n.text) + '</li>';
      }).join('') + '</ul>';
    }

    var noteForm = state.noteOpen === t.id
      ? '<div class="tp-noteform"><input type="text" data-noteinput="' + t.id +
        '" placeholder="진행 상황을 한 줄로" autocomplete="off"><button data-act="notesave" data-id="' +
        t.id + '">기록</button></div>' : '';

    var acts = t.done
      ? '<button data-act="undo" data-id="' + t.id + '">되돌리기</button>' +
        '<button data-act="del" data-id="' + t.id + '">삭제</button>'
      : '<button data-act="prog" data-id="' + t.id + '">진행 +25%</button>' +
        '<button data-act="note" data-id="' + t.id + '">메모</button>' +
        '<button data-act="close" data-id="' + t.id + '">처리</button>';

    var outcomeBox = '';
    if (state.closeOpen === t.id) {
      outcomeBox = '<div class="tp-outcome">' +
        '<button data-act="oc" data-o="done" data-id="' + t.id + '">완료</button>' +
        '<button data-act="oc" data-o="delegate" data-id="' + t.id + '">위임</button>' +
        '<button data-act="oc" data-o="cancel" data-id="' + t.id + '">취소</button>' +
        '<button data-act="oc" data-o="postpone" data-id="' + t.id + '">지연</button>' +
        '</div>';
    }
    if (state.postponeOpen === t.id) {
      outcomeBox += '<div class="tp-postpone">' +
        '<input type="date" data-pdate="' + t.id + '" value="' + esc(addDaysISO(todayISO(), 1)) + '">' +
        '<button data-act="pgo" data-id="' + t.id + '">이 날짜로</button></div>';
    }

    return '<article class="tp-task' + (t.done ? ' is-done' : '') + '" data-p="' + esc(t.prio) + '">' +
      '<button class="tp-stamp" data-act="prio" data-id="' + t.id + '" title="우선순위 바꾸기">' +
      (t.done ? '\u2713' : esc(t.prio)) + '</button>' +
      '<div class="tp-body">' +
        '<button class="tp-title" data-act="edit" data-id="' + t.id + '">' + esc(t.title) + '</button>' +
        '<div class="tp-meta">' + meta.join('') + '</div>' +
        '<div class="tp-bar"><i style="width:' + (t.done ? 100 : (t.progress || 0)) + '%"></i></div>' +
        '<div class="tp-acts">' + acts + '</div>' + outcomeBox + noteForm + notes +
      '</div></article>';
  }

  function renderCal() {
    var ym = state.calMonth;
    var y = Number(ym.split('-')[0]), mo = Number(ym.split('-')[1]);
    var startDow = new Date(y, mo - 1, 1).getDay();
    var daysIn = new Date(y, mo, 0).getDate();

    var byDate = {};
    state.tasks.forEach(function (t) {
      if (t.done || !t.on) return;
      if (!byDate[t.on]) byDate[t.on] = { n: 0, a: false };
      byDate[t.on].n++;
      if (t.prio === 'A') byDate[t.on].a = true;
    });

    var h = '<div class="tp-cal-nav">' +
      '<button data-mon="-1" aria-label="이전 달">\u2039</button>' +
      '<strong>' + y + '년 ' + mo + '월</strong>' +
      '<button data-mon="1" aria-label="다음 달">\u203A</button></div>' +
      '<div class="tp-dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>' +
      '<div class="tp-grid">';

    for (var i = 0; i < startDow; i++) h += '<div class="tp-cell pad"></div>';

    for (var day = 1; day <= daysIn; day++) {
      var iso = y + '-' + String(mo).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      var info = byDate[iso];
      var cls = 'tp-cell';
      if (iso === todayISO()) cls += ' is-today';
      if (iso === state.date) cls += ' is-sel';
      if (info && info.a) cls += ' has-a';
      h += '<button class="' + cls + '" data-date="' + iso + '">' + day +
        (info ? '<span class="dots">' + '\u25CF'.repeat(Math.min(info.n, 3)) + '</span>'
              : '<span class="dash">\u00B7</span>') +
        '</button>';
    }

    h += '</div><p class="tp-cal-hint">날짜를 누르면 그 날 목록으로 이동합니다<br>붉은 점은 A 우선순위가 있는 날입니다</p>';
    el('tp-cal').innerHTML = h;
  }

  function shiftDate(delta) {
    var d = new Date(state.date + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    state.date = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
    state.calMonth = state.date.slice(0, 7);
    if (state.page !== 'edit' && el('tp-form').classList.contains('on')) {
      el('tp-on').value = state.date;
    }
  }

  function attachSwipe(node, canSwipe) {
    var x0 = 0, y0 = 0, live = false;
    node.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1 || !canSwipe()) { live = false; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; live = true;
    }, { passive: true });
    node.addEventListener('touchend', function (e) {
      if (!live) return;
      live = false;
      var t = e.changedTouches[0];
      var dx = t.clientX - x0, dy = t.clientY - y0;
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      if (e.cancelable) e.preventDefault();   // 스와이프가 클릭으로 이어지지 않게
      state.swiped = true;
      setTimeout(function () { state.swiped = false; }, 400);
      shiftDate(dx < 0 ? 1 : -1);
      render();
    }, { passive: false });
  }

  /* ---------- 날짜별 목록 페이지 ---------- */

  function pageList() {
    var iso = state.date, isToday = iso === todayISO();
    return state.tasks.filter(function (x) {
      if (!x.on) return isToday;
      if (x.on === iso) return true;
      return isToday && !x.done && dayDiff(x.on) > 0;
    }).sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      var order = { A: 0, B: 1, C: 2 };
      var la = lateDays(a), lb = lateDays(b);
      if (!a.done && (la > 0) !== (lb > 0)) return la > 0 ? -1 : 1;
      if (order[a.prio] !== order[b.prio]) return order[a.prio] - order[b.prio];
      return (a.on || '9999').localeCompare(b.on || '9999');
    });
  }

  var OUTCOME = {
    done:    { label: '완료', cls: 'done' },
    delegate:{ label: '위임', cls: 'dele' },
    cancel:  { label: '취소', cls: 'canc' },
    postpone:{ label: '지연', cls: 'post' }
  };

  function outcomeOf(t) { return OUTCOME[t.outcome] || OUTCOME.done; }

  function statusChip(t) {
    if (t.done) {
      var o = outcomeOf(t);
      return '<span class="tp-chip ' + o.cls + '">' + o.label + '</span>';
    }
    if (lateDays(t) > 0) return '<span class="tp-chip late">' + lateDays(t) + '일 지연</span>';
    if (t.progress > 0) return '<span class="tp-chip prog">' + t.progress + '%</span>';
    return '<span class="tp-chip">대기</span>';
  }

  function renderPage() {
    var days = ['일', '월', '화', '수', '목', '금', '토'];

    if (state.page === 'edit') {
      el('tp-page-bar').className = 'tp-page-bar';
      el('tp-page-bar').innerHTML =
        '<button data-act="pageback">\u2039 뒤로</button><strong>할 일 편집</strong>';
      el('tp-page-body').innerHTML = '';
      return;
    }

    var iso = state.date;
    var d = new Date(iso + 'T00:00:00');
    var list = pageList();

    el('tp-page-bar').className = 'tp-strip';
    el('tp-page-bar').innerHTML =
      '<button class="arw" data-act="prevday" aria-label="이전 날">\u2039</button>' +
      '<div class="mid"><div class="big">' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' +
      days[d.getDay()] + '요일</div><div class="rel">' + relLabel(iso) +
      ' · 전체 ' + list.length + '건</div></div>' +
      '<button class="arw" data-act="nextday" aria-label="다음 날">\u203A</button>';

    var rows = list.map(function (t) {
      var meta = [];
      if (t.owner) meta.push(esc(t.owner));
      if (t.remind && !t.done) {
        meta.push('\u23F0 ' + ((!t.due || t.due === t.on) ? '' : fmtDue(t.due) + ' ') + esc(t.remind));
      }
      if (t.on && t.on !== iso) meta.push('표시 ' + esc(fmtDue(t.on)));
      if (t.rid) meta.push('\u21BB 반복');
      return '<div class="tp-tr' + (t.done ? ' is-done' : '') + '" data-prio="' + esc(t.prio) + '">' +
        '<button class="pr" data-act="edit" data-id="' + t.id + '">' +
        (t.done ? '\u2713' : esc(t.prio)) + '</button>' +
        '<button class="ct" data-act="edit" data-id="' + t.id + '">' + esc(t.title) +
        (meta.length ? '<em>' + meta.join(' · ') + '</em>' : '') + '</button>' +
        '<button class="st" data-act="step" data-id="' + t.id + '">' + statusChip(t) + '</button></div>';
    }).join('');

    el('tp-page-body').innerHTML =
      '<div class="tp-swipe-hint">위쪽 날짜를 좌우로 넘기면 날짜가 바뀝니다<br>' +
      '상태 칸을 누르면 25%씩 올라가고 100%에서 완료됩니다</div>' +
      (list.length
        ? '<div class="tp-tbl"><div class="tp-thead"><span>순위</span><span>내용</span><span>상태</span></div>' +
          rows + '</div>'
        : '<div class="tp-empty"><strong>이 날에는 할 일이 없습니다</strong>다른 날짜로 넘겨보세요.</div>') +
      '<div class="tp-page-bar" style="padding-top:16px"><button data-act="pagehome">\u2039 홈으로</button>' +
      '<button data-act="pagenew">이 날에 추가</button></div>';
  }

  function render() {
    var wrap = document.querySelector('.tp-wrap');
    wrap.className = 'tp-wrap' + (state.page ? ' on-page page-' + state.page : '');

    if (state.page) { renderPage(); return; }

    header();
    var isCal = state.tab === 'cal';
    el('tp-cal').className = 'tp-cal' + (isCal ? ' on' : '');
    el('tp-list').style.display = isCal ? 'none' : 'block';

    if (isCal) { renderCal(); return; }

    var list = visible();
    el('tp-list').innerHTML = list.length
      ? list.map(taskHTML).join('')
      : '<div class="tp-empty">' + emptyCopy() + '</div>';
    var box = document.querySelector('[data-noteinput]');
    if (box) box.focus();
  }

  function find(id) {
    for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
    return null;
  }

  function add() {
    var title = el('tp-title').value.replace(/[ \t]+$/gm, '').trim();
    if (!title) { el('tp-title').focus(); return; }
    var owner = el('tp-owner').value.trim();
    if (owner) localStorage.setItem(OWNER, owner);

    if (state.editId) {
      var t = find(state.editId);
      if (t) {
        t.title = title;
        t.owner = owner;
        t.prio = state.prio;
        t.on = el('tp-on').value || state.date;
        t.due = el('tp-due').value || t.on;
        t.remind = el('tp-remind').value || null;
        state.date = t.on;
        state.calMonth = state.date.slice(0, 7);
        state.tab = 'day';

        var nr = formRule();
        var cur = t.rid ? findRule(t.rid) : null;
        if (!nr && cur && cur.active) {
          var gone = stopRule(cur.id);
          info('반복을 중단했습니다' + (gone ? ' · 예정 ' + gone + '건 정리' : ''));
        } else if (nr) {
          if (cur) {
            var today0 = todayISO();
            state.tasks = state.tasks.filter(function (x) {
              return !(x.rid === cur.id && !x.done && x.on > today0);
            });
            nr.id = cur.id;
            nr.title = title; nr.owner = owner; nr.prio = state.prio;
            nr.remind = t.remind; nr.lastGen = null;
            rules[rules.indexOf(cur)] = nr;
          } else {
            nr.id = 'r' + Date.now() + Math.floor(Math.random() * 900 + 100);
            nr.title = title; nr.owner = owner; nr.prio = state.prio; nr.remind = t.remind;
            rules.push(nr);
            t.rid = nr.id;
          }
          saveRules();
          var m = syncRules();
          info(ruleText(nr) + ' 반복 설정 · 예정 ' + m + '건 생성');
        }
      }
      closeForm();
      syncTabs(); render(); save(); syncNotifications();
      return;
    }

    state.tasks.push({
      id: 't' + Date.now() + Math.floor(Math.random() * 900 + 100),
      title: title, owner: owner, prio: state.prio,
      on: el('tp-on').value || state.date,
      due: el('tp-due').value || el('tp-on').value || state.date,
      remind: el('tp-remind').value || null,
      nid: (function () {
        var n = Number(localStorage.getItem('dolist.nid') || '1');
        localStorage.setItem('dolist.nid', String(n + 1));
        return n;
      })(),
      progress: 0, notes: [], done: false, createdAt: Date.now()
    });
    var newTask = state.tasks[state.tasks.length - 1];
    var rule = formRule();
    if (rule) {
      rule.id = 'r' + Date.now() + Math.floor(Math.random() * 900 + 100);
      rule.title = newTask.title;
      rule.owner = newTask.owner;
      rule.prio = newTask.prio;
      rule.remind = newTask.remind;
      rule.lastGen = newTask.on;
      rules.push(rule);
      newTask.rid = rule.id;
      saveRules();
      var made = syncRules();
      info(ruleText(rule) + ' 반복 설정 · 예정 ' + made + '건 생성');
    }

    el('tp-title').value = '';
    state.date = newTask.on;
    state.calMonth = state.date.slice(0, 7);
    state.tab = 'day';
    closeForm();
    syncTabs(); render(); save(); syncNotifications();
  }

  /* ---------- 반복 설정 폼 ---------- */

  function repMode() {
    var b = document.querySelector('#tp-rep button[aria-pressed="true"]');
    return b ? b.dataset.r : 'none';
  }

  function monthMode() {
    var b = document.querySelector('#tp-rm-mode button[aria-pressed="true"]');
    return b ? b.dataset.m : 'date';
  }

  function repWeekdays() {
    return [].slice.call(document.querySelectorAll('#tp-rw-dows input:checked'))
      .map(function (x) { return Number(x.value); });
  }

  function setRepMode(mode) {
    document.querySelectorAll('#tp-rep button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.r === mode ? 'true' : 'false');
    });
    ['day', 'week', 'month'].forEach(function (k) {
      el('tp-rep-' + k).className = 'tp-rep-box' + (mode === k ? ' on' : '');
    });
    repPreview();
  }

  function setMonthMode(mode) {
    document.querySelectorAll('#tp-rm-mode button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.m === mode ? 'true' : 'false');
    });
    el('tp-rm-date').style.display = mode === 'date' ? '' : 'none';
    el('tp-rm-nth').style.display = mode === 'nth' ? '' : 'none';
    repPreview();
  }

  function syncDowLabels() {
    document.querySelectorAll('#tp-rw-dows label').forEach(function (l) {
      var i = l.querySelector('input');
      if (i.checked) l.classList.add('sel'); else l.classList.remove('sel');
    });
  }

  /** 폼 입력을 규칙 객체로 */
  function formRule() {
    var mode = repMode();
    if (mode === 'none') return null;
    var start = el('tp-on').value || state.date;
    var r = { freq: mode, start: start, active: true };
    if (mode === 'day') r.n = Math.max(1, Number(el('tp-rd-n').value) || 1);
    else if (mode === 'week') {
      r.n = Math.max(1, Number(el('tp-rw-n').value) || 1);
      var wd = repWeekdays();
      r.weekdays = wd.length ? wd : [isoToDate(start).getDay()];
    } else {
      r.n = Math.max(1, Number(el('tp-rm-n').value) || 1);
      r.monthMode = monthMode();
      if (r.monthMode === 'nth') {
        r.nth = Number(el('tp-rm-nthidx').value) || 1;
        r.nwd = Number(el('tp-rm-nthwd').value) || 0;
      } else {
        r.monthDay = Math.min(31, Math.max(1, Number(el('tp-rm-day').value) || 1));
      }
    }
    return r;
  }

  function repPreview() {
    var r = formRule();
    if (!r) { el('tp-rep-note').innerHTML = ''; return; }
    var from = r.start;
    var next = occurrences(r, from, addDaysISO(from, 400), 4);
    var txt = next.length
      ? next.map(function (d) {
          var dd = isoToDate(d);
          return (dd.getMonth() + 1) + '/' + dd.getDate() + '(' + DOW[dd.getDay()] + ')';
        }).join(' · ')
      : '조건에 맞는 날짜가 없습니다';
    el('tp-rep-note').innerHTML = '<b>' + esc(ruleText(r)) + '</b> · ' + esc(txt) + ' …';
  }

  function copyText(text, btn, label) {
    function done() {
      var old = btn.textContent;
      btn.textContent = '복사됨';
      setTimeout(function () { btn.textContent = old; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); done();
      } catch (e) { warn(label + '를 복사하지 못했습니다.'); }
    }
  }

  document.querySelector('.tp-wrap').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    if (state.swiped) { state.swiped = false; return; }

    if (b.classList.contains('tp-tab')) {
      state.tab = b.dataset.tab;
      state.noteOpen = null;
      state.closeOpen = null;
      state.postponeOpen = null;
      if (state.tab === 'cal') state.calMonth = state.date.slice(0, 7);
      syncTabs(); render(); return;
    }
    if (b.dataset.act === 'cal') {
      state.tab = 'cal';
      state.calMonth = state.date.slice(0, 7);
      syncTabs(); render(); return;
    }
    if (b.dataset.date) {
      state.date = b.dataset.date;
      state.tab = 'day';
      state.noteOpen = null;
      if (el('tp-form').classList.contains('on')) el('tp-on').value = state.date;
      syncTabs(); render(); return;
    }
    if (b.dataset.mon) {
      state.calMonth = addMonth(state.calMonth, Number(b.dataset.mon));
      renderCal(); return;
    }
    if (b.dataset.p && b.closest('#tp-prio')) { state.prio = b.dataset.p; syncPrio(); return; }

    var act = b.dataset.act, t = b.dataset.id ? find(b.dataset.id) : null;
    if (!act || (b.dataset.id && !t)) return;

    if (act === 'edit') { openForm(t, state.page === 'list' ? 'list' : 'main'); render(); return; }
    if (act === 'step') {
      if (t.done) {
        t.done = false; t.doneAt = null; t.outcome = null; t.progress = 0;
      } else if ((t.progress || 0) >= 100) {
        t.done = true; t.doneAt = Date.now(); t.outcome = 'done';
      } else {
        t.progress = Math.min(100, (t.progress || 0) + 25);
      }
      render(); save(); syncNotifications(); return;
    }
    if (act === 'prevday') { shiftDate(-1); render(); return; }
    if (act === 'nextday') { shiftDate(1); render(); return; }
    if (act === 'pageback') { closeForm(); render(); return; }
    if (act === 'pagehome') { state.page = null; state.tab = 'day'; syncTabs(); render(); return; }
    if (act === 'pagenew') { openForm(null, 'list'); render(); return; }

    if (act === 'prio' && !t.done) { t.prio = t.prio === 'A' ? 'B' : t.prio === 'B' ? 'C' : 'A'; }
    else if (act === 'prog') { t.progress = Math.min(100, (t.progress || 0) + 25); }
    else if (act === 'note') { state.noteOpen = state.noteOpen === t.id ? null : t.id; render(); return; }
    else if (act === 'notesave') {
      var input = document.querySelector('[data-noteinput="' + t.id + '"]');
      var v = input ? input.value.trim() : '';
      if (v) { t.notes = t.notes || []; t.notes.push({ t: Date.now(), text: v }); }
      state.noteOpen = null;
      render(); if (v) save();
      return;
    }
    else if (act === 'close') {
      state.closeOpen = state.closeOpen === t.id ? null : t.id;
      state.postponeOpen = null;
      render(); return;
    }
    else if (act === 'oc') {
      if (b.dataset.o === 'postpone') {
        state.postponeOpen = t.id;
        state.closeOpen = null;
        render(); return;
      }
      t.done = true; t.doneAt = Date.now();
      t.outcome = b.dataset.o;
      if (b.dataset.o === 'done') t.progress = 100;
      state.closeOpen = null;
    }
    else if (act === 'pgo') {
      var pin = document.querySelector('[data-pdate="' + t.id + '"]');
      var nd = pin ? pin.value : '';
      if (!nd) { warn('옮길 날짜를 선택해 주세요.'); return; }
      t.done = true; t.doneAt = Date.now(); t.outcome = 'postpone';
      state.tasks.push({
        id: 't' + Date.now() + Math.floor(Math.random() * 900 + 100),
        title: t.title, owner: t.owner, prio: t.prio,
        on: nd, due: nd, remind: t.remind,
        rid: null, progress: t.progress || 0,
        notes: (t.notes || []).slice(),
        done: false, outcome: null, createdAt: Date.now(), nid: nextNid()
      });
      state.postponeOpen = null;
      state.date = nd;
      state.calMonth = nd.slice(0, 7);
      render(); save(); syncNotifications();
      info(fmtDue(nd) + '로 옮겼습니다');
      return;
    }
    else if (act === 'done') { t.done = true; t.doneAt = Date.now(); t.outcome = 'done'; t.progress = 100; }
    else if (act === 'undo') {
      t.done = false; t.doneAt = null; t.outcome = null;
      if (t.progress >= 100) t.progress = 75;
    }
    else if (act === 'del') { state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; }); }
    else return;

    render(); save();
    if (act === 'done' || act === 'oc' || act === 'undo' || act === 'del') syncNotifications();
  });

  /* ---------- 백업 / 복구 ---------- */

  var lastBackupUri = null;
  var pendingRestore = '';
  var LASTBK = 'dolist.lastBackup';

  function saveLastBackup(name, where) {
    try { localStorage.setItem(LASTBK, JSON.stringify({ name: name, where: where, at: Date.now() })); }
    catch (e) {}
  }

  function lastBackupInfo() {
    try {
      var v = JSON.parse(localStorage.getItem(LASTBK));
      if (v && v.name) return v;
    } catch (e) {}
    return null;
  }

  function bkShow(ids, on) {
    ids.forEach(function (id) { el(id).style.display = on ? '' : 'none'; });
  }

  function stamp() {
    var d = new Date(), z = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes());
  }

  async function saveBackupFile() {
    var name = 'dolist-backup-' + stamp() + '.json';
    var json = JSON.stringify(state.tasks);
    var FS = plug('Filesystem');
    lastBackupUri = null;

    if (FS && FS.writeFile) {
      var dirs = ['DOCUMENTS', 'EXTERNAL', 'CACHE'];
      for (var i = 0; i < dirs.length; i++) {
        try {
          var r = await FS.writeFile({ path: name, data: json, directory: dirs[i], encoding: 'utf8', recursive: true });
          lastBackupUri = (r && r.uri) || null;
          var where = dirs[i] === 'DOCUMENTS' ? '내장메모리 › Documents'
            : dirs[i] === 'EXTERNAL' ? 'Android › data › kr.dolist.planner › files' : '임시 저장 공간';
          saveLastBackup(name, where);
          el('tp-bk-res').innerHTML = '<b>파일로 저장했습니다</b><br>' + esc(name) +
            '<br>저장 위치 · ' + esc(where) + '<br>' + state.tasks.length + '건' +
            (dirs[i] === 'CACHE' ? '<br>임시 공간이라 지워질 수 있습니다. 파일 보내기로 옮겨두세요.' : '');
          return true;
        } catch (e) { }
      }
      el('tp-bk-res').innerHTML = '파일로 저장하지 못했습니다. 저장 공간을 확인해 주세요.';
      return false;
    }

    try {
      var blob = new Blob([json], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      saveLastBackup(name, '다운로드 폴더');
      el('tp-bk-res').innerHTML = '<b>파일로 저장했습니다</b><br>' + esc(name) +
        '<br>저장 위치 · 다운로드 폴더<br>' + state.tasks.length + '건';
      return true;
    } catch (e) {
      el('tp-bk-res').innerHTML = '파일로 저장하지 못했습니다.';
      return false;
    }
  }

  async function openBackup(mode) {
    el('tp-bk').classList.add('on');
    el('tp-bk-input').value = '';
    pendingRestore = '';

    if (mode === 'backup') {
      bkShow(['tp-bk-input', 'tp-bk-merge', 'tp-bk-replace'], false);
      el('tp-bk-res').innerHTML = '저장하고 있습니다\u2026';
      el('tp-bk-note').textContent =
        '파일을 잃어버리면 복구할 수 없습니다. 파일 보내기로 메일이나 드라이브에 한 부 옮겨두시는 걸 권합니다.';
      var ok = await saveBackupFile();
      bkShow(['tp-bk-share'], !!(ok && lastBackupUri));
    } else {
      bkShow(['tp-bk-input', 'tp-bk-merge', 'tp-bk-replace'], true);
      bkShow(['tp-bk-share'], false);
      var lb = lastBackupInfo();
      el('tp-bk-res').innerHTML = lb
        ? '<b>백업 파일 위치</b><br>' + esc(lb.name) + '<br>' + esc(lb.where) +
          '<br>메일이나 드라이브로 보낸 파일도 선택할 수 있습니다.'
        : '<b>백업 파일 위치</b><br>이 앱에서 백업한 기록이 없습니다.<br>' +
          '보관해 둔 dolist-backup-…json 파일을 선택해 주세요.';
      el('tp-bk-note').textContent =
        '통합 복구는 현재 목록을 두고 없는 항목만 더합니다. 교체 복구는 현재 목록을 백업 내용으로 바꿉니다.';
    }
    el('tp-bk').scrollIntoView({ block: 'nearest' });
  }

  function parseBackup() {
    var raw = (pendingRestore || '').trim();
    if (!raw) { el('tp-bk-note').textContent = '먼저 백업 파일을 선택해 주세요.'; return null; }
    var arr;
    try { arr = JSON.parse(raw); } catch (e) {
      el('tp-bk-note').textContent = '형식이 올바르지 않습니다. 백업 파일이 맞는지 확인해 주세요.';
      return null;
    }
    if (!Array.isArray(arr)) { el('tp-bk-note').textContent = '백업 내용이 아닙니다.'; return null; }
    var clean = arr.filter(function (t) { return t && t.id && t.title; }).map(function (t) {
      return {
        id: String(t.id),
        title: String(t.title),
        owner: t.owner ? String(t.owner) : '',
        prio: (t.prio === 'A' || t.prio === 'B' || t.prio === 'C') ? t.prio : 'B',
        rid: t.rid || null,
        on: t.on || t.due || todayISO(),
        due: t.due || t.on || todayISO(),
        remind: t.remind || null,
        progress: Number(t.progress) || 0,
        notes: Array.isArray(t.notes) ? t.notes : [],
        done: !!t.done,
        outcome: t.outcome || (t.done ? 'done' : null),
        doneAt: t.doneAt || null,
        nid: Number(t.nid) || 0,
        createdAt: t.createdAt || Date.now()
      };
    });
    if (!clean.length) { el('tp-bk-note').textContent = '불러올 항목이 없습니다.'; return null; }
    return clean;
  }

  }

  el('tp-bk-input').addEventListener('change', function () {

      try { arr = JSON.parse(pendingRestore); } catch (e) {}
      el('tp-bk-note').textContent = Array.isArray(arr)
        ? f.name + ' · ' + arr.length + '건 확인. 통합 복구 또는 교체 복구를 누르세요.'
        : f.name + ' 을 읽었지만 백업 형식이 아닙니다.';
    };
    rd.onerror = function () { el('tp-bk-note').textContent = '파일을 읽지 못했습니다.'; };
    rd.readAsText(f);
  });

  el('tp-bk-share').addEventListener('click', async function () {
    var SH = plug('Share');
    if (!SH || !SH.share || !lastBackupUri) {
      warn('공유 기능을 쓸 수 없습니다. 파일 앱에서 직접 옮겨주세요.');
      return;
    }
    try {
      await SH.share({ title: '할일관리 백업', files: [lastBackupUri], dialogTitle: '백업 파일 보내기' });
    } catch (e) {
      try { await SH.share({ title: '할일관리 백업', url: lastBackupUri }); }
      catch (e2) { warn('공유 창을 열지 못했습니다.'); }
    }
  });

  el('tp-bk-merge').addEventListener('click', function () {
    var arr = parseBackup();
    if (!arr) return;
    var have = {};
    state.tasks.forEach(function (t) { have[t.id] = true; });
    var added = 0;
    arr.forEach(function (t) { if (!have[t.id]) { state.tasks.push(t); added++; } });
    finishRestore('통합 복구 완료 · ' + added + '건 추가, 중복 ' + (arr.length - added) + '건 제외');
  });

  el('tp-bk-replace').addEventListener('click', function () {
    var arr = parseBackup();
    if (!arr) return;
    var before = state.tasks.length;
    state.tasks = arr;
    finishRestore('교체 복구 완료 · ' + arr.length + '건으로 바뀜 (기존 ' + before + '건 대체)');
  });

  el('tp-openlist').addEventListener('click', function () {
    state.page = 'list';
    render();
  });

  attachSwipe(document.querySelector('.tp-wrap > header'),
    function () { return !state.page && state.tab === 'day'; });
  attachSwipe(el('tp-page-bar'), function () { return state.page === 'list'; });

  async function checkOpenView() {
    if (!PREF) return;
    try {
      var r = await PREF.get({ key: 'open_view' });
      if (!r || !r.value) r = await PREF.get({ key: '_cap_open_view' });
      if (r && r.value) {
        try { await PREF.remove({ key: 'open_view' }); } catch (e2) {}
        try { await PREF.remove({ key: '_cap_open_view' }); } catch (e2) {}
        state.date = todayISO();
        state.calMonth = state.date.slice(0, 7);
        state.editId = null;
        el('tp-form').classList.remove('on');
        el('tp-open').style.display = 'block';
        state.page = 'list';
        render();
      }
    } catch (e) {}
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkOpenView();
  });

  el('tp-today-btn').addEventListener('click', function () {
    state.date = todayISO();
    state.calMonth = state.date.slice(0, 7);
    state.tab = 'day';
    syncTabs(); render();
  });

  state.date = todayISO();
  state.calMonth = state.date.slice(0, 7);
  load();
  loadRules();
  syncRules();
  render();
  mirrorWidget();
  checkOpenView();
  maybeAskPermission();
  if (NATIVE) syncNotifications();
})();
</script>
</body>
</html>
