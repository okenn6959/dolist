<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F4">
<title>할일관리</title>
<style>
  :root {
    --ink: #14171C;
    --ink-soft: #5A626E;
    --ink-faint: #8E96A2;
    --line: #D6DAE0;
    --line-soft: #E6E9ED;
    --paper: #F5F6F4;
    --card: #FFFFFF;
    --stamp: #B3261E;
    --done: #2E6B5E;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", "DejaVu Sans Mono", monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--paper);
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }

  .tp-wrap {
    font-family: var(--sans);
    color: var(--ink);
    max-width: 620px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 44px);
    -webkit-font-smoothing: antialiased;
  }

  .tp-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .tp-date {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 6px 0 0;
    line-height: 1.15;
  }
  .tp-date span { color: var(--ink-faint); font-weight: 500; }

  .tp-stat {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 7px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tp-stat b { color: var(--ink); font-weight: 700; }
  .tp-stat .late { color: var(--stamp); }

  .tp-rule { height: 1px; background: var(--line); margin: 18px 0 14px; border: 0; }

  .tp-open {
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .tp-open:active { transform: translateY(1px); }

  .tp-form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    display: none;
  }
  .tp-form.on { display: block; }

  .tp-field { margin-bottom: 11px; }
  .tp-label {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }
  .tp-form input[type="text"], .tp-form input[type="date"] {
    width: 100%;
    font-family: var(--sans);
    font-size: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }

  .tp-seg { display: flex; gap: 6px; }
  .tp-seg button {
    flex: 1;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tp-seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tp-seg button[data-p="A"][aria-pressed="true"] { background: var(--stamp); border-color: var(--stamp); }
  .tp-seg .hint { display: block; font-family: var(--sans); font-size: 10px; font-weight: 500; opacity: .75; }

  .tp-row2 { display: flex; gap: 10px; }
  .tp-row2 > * { flex: 1; }

  .tp-submit {
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 13px;
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 3px;
  }
  .tp-cancel {
    width: 100%;
    background: none;
    border: 0;
    color: var(--ink-faint);
    font-family: var(--sans);
    font-size: 13px;
    padding: 10px;
    cursor: pointer;
  }

  .tp-tabs { display: flex; gap: 15px; border-bottom: 1px solid var(--line); margin: 20px 0 4px; }
  .tp-tab {
    background: none;
    border: 0;
    padding: 0 0 9px;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-faint);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tp-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .tp-tab .n { font-family: var(--mono); font-size: 11.5px; font-weight: 500; opacity: .7; margin-left: 4px; }

  .tp-task {
    display: flex;
    gap: 12px;
    padding: 15px 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .tp-stamp {
    flex: 0 0 auto;
    width: 35px; height: 35px;
    margin-top: 1px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 4px;
    background: none;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transform: rotate(-6deg);
    transition: transform .12s ease;
  }
  .tp-stamp:active { transform: rotate(-6deg) scale(.93); }
  .tp-task[data-p="A"] .tp-stamp { border-color: var(--stamp); color: var(--stamp); border-width: 2px; }
  .tp-task.is-done .tp-stamp { border-color: var(--done); color: var(--done); }

  .tp-body { flex: 1; min-width: 0; }
  .tp-title { font-size: 15.5px; font-weight: 600; line-height: 1.4; margin: 0; word-break: break-word; }
  .tp-task.is-done .tp-title { color: var(--ink-faint); text-decoration: line-through; text-decoration-thickness: 1px; }

  .tp-meta {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-top: 5px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tp-meta .late { color: var(--stamp); font-weight: 700; }

  .tp-bar { height: 5px; background: var(--line-soft); border-radius: 3px; margin-top: 9px; overflow: hidden; }
  .tp-bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width .2s ease; }
  .tp-task.is-done .tp-bar i { background: var(--done); }

  .tp-acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tp-acts button {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .tp-acts button[data-act="done"] { color: var(--done); border-color: #BFD8D2; }
  .tp-acts button[data-act="del"] { color: var(--stamp); border-color: #E8C9C6; }

  .tp-notes { list-style: none; margin: 10px 0 0; padding: 0 0 0 11px; border-left: 2px solid var(--line-soft); }
  .tp-notes li { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 5px; }
  .tp-notes time { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-right: 6px; }

  .tp-noteform { display: flex; gap: 6px; margin-top: 9px; }
  .tp-noteform input {
    flex: 1;
    font-family: var(--sans);
    font-size: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 10px;
    color: var(--ink);
  }
  .tp-noteform button {
    background: var(--ink); color: #fff; border: 0; border-radius: 7px;
    padding: 0 15px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .tp-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.6;
  }
  .tp-empty strong { display: block; color: var(--ink); font-size: 15.5px; margin-bottom: 5px; }

  .tp-foot { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tp-foot button {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 11px;
    cursor: pointer;
  }

  .tp-bell {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 12px;
    padding: 11px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .tp-bell-txt { flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0; }
  .tp-bell-txt em {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    font-style: normal;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    margin-top: 2px;
  }
  .tp-bell input[type="time"] {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 8px;
  }
  .tp-bell button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    background: var(--ink);
    color: #fff;
    border: 0;
    border-radius: 7px;
    padding: 9px 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tp-bell.is-on button { background: var(--card); color: var(--done); border: 1px solid #BFD8D2; }
  .tp-bell.is-off button[disabled] { background: var(--line); color: var(--ink-faint); }

  .tp-today-btn {
    display: none;
    margin-top: 9px;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .tp-today-btn.on { display: inline-block; }

  .tp-cal { display: none; padding-top: 4px; }
  .tp-cal.on { display: block; }

  .tp-cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 2px 10px;
  }
  .tp-cal-nav strong { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .tp-cal-nav button {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 36px; height: 34px;
    font-size: 15px;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .tp-dow, .tp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .tp-dow div {
    text-align: center;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    padding-bottom: 6px;
  }
  .tp-dow div:first-child, .tp-dow div:last-child { color: var(--ink-faint); opacity: .7; }

  .tp-cell {
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--ink);
    cursor: pointer;
    padding: 0;
  }
  .tp-cell.pad { background: none; border-color: transparent; cursor: default; }
  .tp-cell.is-today { border-color: var(--ink); border-width: 1.5px; }
  .tp-cell.is-sel { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tp-cell .cnt {
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    color: var(--ink-faint);
  }
  .tp-cell.has-a .cnt { color: var(--stamp); }
  .tp-cell.is-sel .cnt { color: rgba(255,255,255,.75); }
  .tp-cell .dash { font-size: 10px; line-height: 1; color: var(--line); }
  .tp-cell.is-sel .dash { color: rgba(255,255,255,.35); }

  .tp-cal-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
    padding: 14px 0 2px;
    line-height: 1.6;
  }

  .tp-banner {
    background: #FBF0EF;
    border: 1px solid #E8C9C6;
    color: #7E211B;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
  .tp-banner.on { display: block; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="tp-wrap">
  <div class="tp-banner" id="tp-banner"></div>

  <header>
    <div class="tp-eyebrow">할일관리</div>
    <h1 class="tp-date" id="tp-date">불러오는 중</h1>
    <div class="tp-stat" id="tp-stat"></div>
    <button class="tp-today-btn" id="tp-today-btn">오늘로 돌아가기</button>
  </header>

  <hr class="tp-rule">

  <button class="tp-open" id="tp-open">할 일 추가</button>

  <div class="tp-form" id="tp-form">
    <div class="tp-field">
      <label class="tp-label" for="tp-title">할 일</label>
      <input type="text" id="tp-title" placeholder="예: 벤더 회신 확인" autocomplete="off">
    </div>

    <div class="tp-field">
      <span class="tp-label">우선순위</span>
      <div class="tp-seg" id="tp-prio">
        <button type="button" data-p="A" aria-pressed="true">A<span class="hint">오늘 필수</span></button>
        <button type="button" data-p="B" aria-pressed="false">B<span class="hint">해야 함</span></button>
        <button type="button" data-p="C" aria-pressed="false">C<span class="hint">하면 좋음</span></button>
      </div>
    </div>

    <div class="tp-row2">
      <div class="tp-field">
        <label class="tp-label" for="tp-owner">담당</label>
        <input type="text" id="tp-owner" placeholder="이름" autocomplete="off">
      </div>
      <div class="tp-field">
        <label class="tp-label" for="tp-due">마감</label>
        <input type="date" id="tp-due">
      </div>
    </div>

    <div class="tp-field">
      <label class="tp-label" for="tp-remind">알림 시각 · 비우면 알림 없음</label>
      <input type="time" id="tp-remind">
    </div>

    <button class="tp-submit" id="tp-save">목록에 넣기</button>
    <button class="tp-cancel" id="tp-cancel">닫기</button>
  </div>

  <div class="tp-bell is-off" id="tp-bell">
    <div class="tp-bell-txt">매일 알림<em id="tp-bell-state">꺼짐</em></div>
    <input type="time" id="tp-bell-time" value="08:30" aria-label="매일 알림 시각">
    <button id="tp-bell-toggle">켜기</button>
  </div>

  <nav class="tp-tabs" role="tablist">
    <button class="tp-tab" role="tab" data-tab="day" aria-selected="true">날짜<span class="n" id="n-day"></span></button>
    <button class="tp-tab" role="tab" data-tab="cal" aria-selected="false">달력</button>
    <button class="tp-tab" role="tab" data-tab="all" aria-selected="false">전체<span class="n" id="n-all"></span></button>
    <button class="tp-tab" role="tab" data-tab="done" aria-selected="false">완료함<span class="n" id="n-done"></span></button>
  </nav>

  <div class="tp-cal" id="tp-cal"></div>
  <div id="tp-list"></div>

  <div class="tp-foot">
    <button id="tp-copy">오늘 목록 복사</button>
    <button id="tp-backup">백업 복사</button>
    <button id="tp-clear">완료함 비우기</button>
  </div>
</div>

<script>
(function () {
  var KEY = 'dolist.tasks.v1';
  var OWNER = 'dolist.owner';
  var state = { tasks: [], tab: 'day', date: null, calMonth: null, prio: 'A', noteOpen: null };

  var el = function (id) { return document.getElementById(id); };
  var banner = el('tp-banner');

  function warn(msg) { banner.textContent = msg; banner.classList.add('on'); }
  function clearWarn() { banner.classList.remove('on'); banner.textContent = ''; }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function dayDiff(iso) {
    if (!iso) return 0;
    return Math.round((new Date(todayISO() + 'T00:00:00') - new Date(iso + 'T00:00:00')) / 86400000);
  }

  function addMonth(ym, delta) {
    var y = Number(ym.split('-')[0]), m = Number(ym.split('-')[1]) + delta;
    y += Math.floor((m - 1) / 12);
    m = ((m - 1) % 12 + 12) % 12 + 1;
    return y + '-' + String(m).padStart(2, '0');
  }

  function relLabel(iso) {
    var d = dayDiff(iso);
    if (d === 0) return '오늘';
    if (d === 1) return '어제';
    if (d === -1) return '내일';
    return d > 0 ? d + '일 전' : (-d) + '일 후';
  }

  function fmtDue(iso) {
    if (!iso) return '마감 없음';
    var p = iso.split('-');
    return Number(p[1]) + '월 ' + Number(p[2]) + '일';
  }

  function hhmm(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      state.tasks = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(state.tasks)) state.tasks = [];
    } catch (e) {
      state.tasks = [];
      warn('저장된 목록을 읽지 못했습니다. 새 목록으로 시작합니다.');
    }
    var o = localStorage.getItem(OWNER);
    if (o) el('tp-owner').value = o;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state.tasks));
      mirrorWidget();
      clearWarn();
    } catch (e) {
      warn('저장에 실패했습니다. 완료함을 비워 공간을 확보한 뒤 다시 시도해 주세요.');
    }
  }

  /* ---------- 로컬 알림 ---------- */

  var CAP = window.Capacitor || null;
  var LN = (CAP && CAP.Plugins && CAP.Plugins.LocalNotifications) || null;
  var PREF = (CAP && CAP.Plugins && CAP.Plugins.Preferences) || null;
  var NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform() && LN);
  var SET = 'dolist.notify.v1';
  var DAILY_ID = 9001;

  function notifySet() {
    try {
      var s = JSON.parse(localStorage.getItem(SET));
      if (s && typeof s === 'object') return { daily: !!s.daily, time: s.time || '08:30' };
    } catch (e) {}
    return { daily: false, time: '08:30' };
  }

  function notifySave(s) {
    try { localStorage.setItem(SET, JSON.stringify(s)); } catch (e) {}
  }

  function nidFor(t) {
    if (!t.nid) {
      var n = Number(localStorage.getItem('dolist.nid') || '1');
      t.nid = n;
      localStorage.setItem('dolist.nid', String(n + 1));
    }
    return t.nid;
  }

  async function askPermission() {
    if (!NATIVE) return false;
    try {
      var r = await LN.checkPermissions();
      if (r.display !== 'granted') r = await LN.requestPermissions();
      return r.display === 'granted';
    } catch (e) { return false; }
  }

  async function syncNotifications() {
    if (!NATIVE) return;
    try {
      var pending = await LN.getPending();
      var old = (pending.notifications || []).map(function (n) { return { id: n.id }; });
      if (old.length) await LN.cancel({ notifications: old });

      var list = [];
      var s = notifySet();

      if (s.daily) {
        var hm = (s.time || '08:30').split(':');
        list.push({
          id: DAILY_ID,
          title: '할일관리',
          body: '오늘 목록을 확인하세요',
          schedule: { on: { hour: Number(hm[0]), minute: Number(hm[1]) }, allowWhileIdle: true }
        });
      }

      var assigned = false;
      state.tasks.forEach(function (t) {
        if (t.done || !t.remind || !t.due) return;
        var at = new Date(t.due + 'T' + t.remind + ':00');
        if (isNaN(at.getTime()) || at.getTime() <= Date.now() + 10000) return;
        if (!t.nid) assigned = true;
        list.push({
          id: nidFor(t),
          title: '[' + t.prio + '] ' + t.title,
          body: (t.owner ? t.owner + ' · ' : '') + '마감 ' + fmtDue(t.due),
          schedule: { at: at, allowWhileIdle: true }
        });
      });

      if (assigned) save();
      if (list.length) await LN.schedule({ notifications: list });
      clearWarn();
    } catch (e) {
      warn('알림을 예약하지 못했습니다. 폰 설정에서 할일관리의 알림 권한을 확인해 주세요.');
    }
  }

  /* ---------- 홈 화면 위젯용 사본 ---------- */

  function widgetItems() {
    var today = todayISO();
    var list = state.tasks.filter(function (x) {
      if (x.done) return false;
      if (!x.due) return true;
      return x.due === today || dayDiff(x.due) > 0;
    });
    var order = { A: 0, B: 1, C: 2 };
    list.sort(function (a, b) {
      var la = a.due ? dayDiff(a.due) : 0, lb = b.due ? dayDiff(b.due) : 0;
      if ((la > 0) !== (lb > 0)) return la > 0 ? -1 : 1;
      if (order[a.prio] !== order[b.prio]) return order[a.prio] - order[b.prio];
      return (a.due || '9999').localeCompare(b.due || '9999');
    });
    return list;
  }

  function mirrorWidget() {
    if (!PREF) return;
    var d = new Date();
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    var list = widgetItems();
    var late = list.filter(function (t) { return t.due && dayDiff(t.due) > 0; }).length;

    var payload = {
      head: (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()] + '요일',
      sub: '남은 일 ' + list.length + (late ? ' · 밀린 일 ' + late : ''),
      items: list.slice(0, 5).map(function (t) {
        var late1 = t.due && dayDiff(t.due) > 0;
        return {
          p: t.prio,
          t: t.title,
          m: late1 ? dayDiff(t.due) + '일 밀림' : (t.progress || 0) + '%'
        };
      })
    };

    try { PREF.set({ key: 'widget_today', value: JSON.stringify(payload) }); } catch (e) {}
  }

  function renderBell() {
    var s = notifySet();
    var wrap = el('tp-bell');
    var btn = el('tp-bell-toggle');
    el('tp-bell-time').value = s.time;

    if (!NATIVE) {
      wrap.className = 'tp-bell is-off';
      el('tp-bell-state').textContent = '설치한 앱에서만 동작';
      btn.textContent = '켜기';
      btn.disabled = true;
      return;
    }
    btn.disabled = false;
    if (s.daily) {
      wrap.className = 'tp-bell is-on';
      el('tp-bell-state').textContent = s.time + ' 알림 켜짐';
      btn.textContent = '끄기';
    } else {
      wrap.className = 'tp-bell is-off';
      el('tp-bell-state').textContent = '꺼짐';
      btn.textContent = '켜기';
    }
  }

  function header() {
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    var iso = state.date;
    var d = new Date(iso + 'T00:00:00');
    var isToday = iso === todayISO();

    el('tp-date').innerHTML = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 <span>' +
      days[d.getDay()] + '요일' + (isToday ? '' : ' · ' + relLabel(iso)) + '</span>';
    el('tp-today-btn').className = 'tp-today-btn' + (isToday ? '' : ' on');

    var open = state.tasks.filter(function (t) { return !t.done; });
    var late = open.filter(function (t) { return t.due && dayDiff(t.due) > 0; });
    var dayN = dayList().length;

    var s = '<span>이 날 <b>' + dayN + '</b></span><span>남은 일 <b>' + open.length + '</b></span>';
    if (late.length) s += '<span class="late">밀린 일 ' + late.length + '</span>';
    el('tp-stat').innerHTML = s;

    el('n-day').textContent = dayN || '';
    el('n-all').textContent = open.length || '';
    el('n-done').textContent = (state.tasks.length - open.length) || '';
  }

  function dayList() {
    var iso = state.date, isToday = iso === todayISO();
    return state.tasks.filter(function (x) {
      if (x.done) return false;
      if (!x.due) return isToday;
      return x.due === iso || (isToday && dayDiff(x.due) > 0);
    });
  }

  function visible() {
    var t = state.tab;
    var list = t === 'day' ? dayList() : state.tasks.filter(function (x) {
      if (t === 'done') return x.done;
      return !x.done;
    });
    var order = { A: 0, B: 1, C: 2 };
    list.sort(function (a, b) {
      if (t === 'done') return (b.doneAt || 0) - (a.doneAt || 0);
      var la = a.due ? dayDiff(a.due) : -999, lb = b.due ? dayDiff(b.due) : -999;
      if ((la > 0) !== (lb > 0)) return la > 0 ? -1 : 1;
      if (order[a.prio] !== order[b.prio]) return order[a.prio] - order[b.prio];
      return (a.due || '9999').localeCompare(b.due || '9999');
    });
    return list;
  }

  function emptyCopy() {
    if (state.tab === 'done') return '<strong>완료함이 비어 있습니다</strong>끝낸 일에 완료를 누르면 여기로 옮겨집니다.';
    if (state.tab === 'day') {
      return state.date === todayISO()
        ? '<strong>오늘 처리할 일이 없습니다</strong>위에서 할 일을 하나 넣어보세요.'
        : '<strong>이 날에는 할 일이 없습니다</strong>추가하면 이 날짜로 들어갑니다.';
    }
    return '<strong>목록이 비어 있습니다</strong>위에서 할 일을 하나 넣어보세요.';
  }

  function taskHTML(t) {
    var late = !t.done && t.due && dayDiff(t.due) > 0;
    var meta = [];
    if (t.owner) meta.push('<span>' + esc(t.owner) + '</span>');
    meta.push('<span>' + esc(fmtDue(t.due)) + '</span>');
    if (late) meta.push('<span class="late">' + dayDiff(t.due) + '일 밀림</span>');
    if (t.done && t.doneAt) meta.push('<span>' + hhmm(t.doneAt) + ' 완료</span>');
    if (!t.done) meta.push('<span>' + (t.progress || 0) + '%</span>');
    if (!t.done && t.remind) meta.push('<span>\u23F0 ' + esc(t.remind) + '</span>');

    var notes = '';
    if (t.notes && t.notes.length) {
      notes = '<ul class="tp-notes">' + t.notes.slice(-4).map(function (n) {
        return '<li><time>' + hhmm(n.t) + '</time>' + esc(n.text) + '</li>';
      }).join('') + '</ul>';
    }

    var noteForm = state.noteOpen === t.id
      ? '<div class="tp-noteform"><input type="text" data-noteinput="' + t.id +
        '" placeholder="진행 상황을 한 줄로" autocomplete="off"><button data-act="notesave" data-id="' +
        t.id + '">기록</button></div>' : '';

    var acts = t.done
      ? '<button data-act="undo" data-id="' + t.id + '">되돌리기</button>' +
        '<button data-act="del" data-id="' + t.id + '">삭제</button>'
      : '<button data-act="prog" data-id="' + t.id + '">진행 +25%</button>' +
        '<button data-act="note" data-id="' + t.id + '">메모</button>' +
        '<button data-act="done" data-id="' + t.id + '">완료</button>';

    return '<article class="tp-task' + (t.done ? ' is-done' : '') + '" data-p="' + esc(t.prio) + '">' +
      '<button class="tp-stamp" data-act="prio" data-id="' + t.id + '" title="우선순위 바꾸기">' +
      (t.done ? '\u2713' : esc(t.prio)) + '</button>' +
      '<div class="tp-body">' +
        '<h3 class="tp-title">' + esc(t.title) + '</h3>' +
        '<div class="tp-meta">' + meta.join('') + '</div>' +
        '<div class="tp-bar"><i style="width:' + (t.done ? 100 : (t.progress || 0)) + '%"></i></div>' +
        '<div class="tp-acts">' + acts + '</div>' + noteForm + notes +
      '</div></article>';
  }

  function renderCal() {
    var ym = state.calMonth;
    var y = Number(ym.split('-')[0]), mo = Number(ym.split('-')[1]);
    var startDow = new Date(y, mo - 1, 1).getDay();
    var daysIn = new Date(y, mo, 0).getDate();

    var byDate = {};
    state.tasks.forEach(function (t) {
      if (t.done || !t.due) return;
      if (!byDate[t.due]) byDate[t.due] = { n: 0, a: false };
      byDate[t.due].n++;
      if (t.prio === 'A') byDate[t.due].a = true;
    });

    var h = '<div class="tp-cal-nav">' +
      '<button data-mon="-1" aria-label="이전 달">\u2039</button>' +
      '<strong>' + y + '년 ' + mo + '월</strong>' +
      '<button data-mon="1" aria-label="다음 달">\u203A</button></div>' +
      '<div class="tp-dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>' +
      '<div class="tp-grid">';

    for (var i = 0; i < startDow; i++) h += '<div class="tp-cell pad"></div>';

    for (var day = 1; day <= daysIn; day++) {
      var iso = y + '-' + String(mo).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      var info = byDate[iso];
      var cls = 'tp-cell';
      if (iso === todayISO()) cls += ' is-today';
      if (iso === state.date) cls += ' is-sel';
      if (info && info.a) cls += ' has-a';
      h += '<button class="' + cls + '" data-date="' + iso + '">' + day +
        (info ? '<span class="cnt">' + info.n + '</span>' : '<span class="dash">\u00B7</span>') +
        '</button>';
    }

    h += '</div><p class="tp-cal-hint">날짜를 누르면 그 날 목록으로 이동합니다<br>붉은 숫자는 A 우선순위가 있는 날입니다</p>';
    el('tp-cal').innerHTML = h;
  }

  function render() {
    header();
    var isCal = state.tab === 'cal';
    el('tp-cal').className = 'tp-cal' + (isCal ? ' on' : '');
    el('tp-list').style.display = isCal ? 'none' : 'block';

    if (isCal) { renderCal(); return; }

    var list = visible();
    el('tp-list').innerHTML = list.length
      ? list.map(taskHTML).join('')
      : '<div class="tp-empty">' + emptyCopy() + '</div>';
    var box = document.querySelector('[data-noteinput]');
    if (box) box.focus();
  }

  function find(id) {
    for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
    return null;
  }

  function add() {
    var title = el('tp-title').value.trim();
    if (!title) { el('tp-title').focus(); return; }
    var owner = el('tp-owner').value.trim();
    state.tasks.push({
      id: 't' + Date.now() + Math.floor(Math.random() * 900 + 100),
      title: title, owner: owner, prio: state.prio,
      due: el('tp-due').value || state.date,
      remind: el('tp-remind').value || null,
      nid: (function () {
        var n = Number(localStorage.getItem('dolist.nid') || '1');
        localStorage.setItem('dolist.nid', String(n + 1));
        return n;
      })(),
      progress: 0, notes: [], done: false, createdAt: Date.now()
    });
    if (owner) localStorage.setItem(OWNER, owner);
    el('tp-title').value = '';
    state.date = state.tasks[state.tasks.length - 1].due;
    state.calMonth = state.date.slice(0, 7);
    state.tab = 'day';
    syncTabs(); render(); save(); syncNotifications();
  }

  function syncTabs() {
    document.querySelectorAll('.tp-tab').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === state.tab ? 'true' : 'false');
    });
  }

  function copyText(text, btn, label) {
    function done() {
      var old = btn.textContent;
      btn.textContent = '복사됨';
      setTimeout(function () { btn.textContent = old; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); done();
      } catch (e) { warn(label + '를 복사하지 못했습니다.'); }
    }
  }

  document.querySelector('.tp-wrap').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;

    if (b.classList.contains('tp-tab')) {
      state.tab = b.dataset.tab;
      state.noteOpen = null;
      if (state.tab === 'cal') state.calMonth = state.date.slice(0, 7);
      syncTabs(); render(); return;
    }
    if (b.dataset.date) {
      state.date = b.dataset.date;
      state.tab = 'day';
      state.noteOpen = null;
      syncTabs(); render(); return;
    }
    if (b.dataset.mon) {
      state.calMonth = addMonth(state.calMonth, Number(b.dataset.mon));
      renderCal(); return;
    }
    if (b.dataset.p) {
      state.prio = b.dataset.p;
      document.querySelectorAll('#tp-prio button').forEach(function (x) {
        x.setAttribute('aria-pressed', x.dataset.p === state.prio ? 'true' : 'false');
      });
      return;
    }

    var act = b.dataset.act, t = b.dataset.id ? find(b.dataset.id) : null;
    if (!act || (b.dataset.id && !t)) return;

    if (act === 'prio' && !t.done) { t.prio = t.prio === 'A' ? 'B' : t.prio === 'B' ? 'C' : 'A'; }
    else if (act === 'prog') { t.progress = Math.min(100, (t.progress || 0) + 25); }
    else if (act === 'note') { state.noteOpen = state.noteOpen === t.id ? null : t.id; render(); return; }
    else if (act === 'notesave') {
      var input = document.querySelector('[data-noteinput="' + t.id + '"]');
      var v = input ? input.value.trim() : '';
      if (v) { t.notes = t.notes || []; t.notes.push({ t: Date.now(), text: v }); }
      state.noteOpen = null;
      render(); if (v) save();
      return;
    }
    else if (act === 'done') { t.done = true; t.doneAt = Date.now(); t.progress = 100; }
    else if (act === 'undo') { t.done = false; t.doneAt = null; t.progress = 75; }
    else if (act === 'del') { state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; }); }
    else return;

    render(); save();
    if (act === 'done' || act === 'undo' || act === 'del') syncNotifications();
  });

  el('tp-open').addEventListener('click', function () {
    el('tp-form').classList.add('on');
    el('tp-open').style.display = 'none';
    el('tp-due').value = state.date;
    el('tp-title').focus();
  });
  el('tp-cancel').addEventListener('click', function () {
    el('tp-form').classList.remove('on');
    el('tp-open').style.display = 'block';
  });
  el('tp-save').addEventListener('click', add);
  el('tp-title').addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });

  document.querySelector('.tp-wrap').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var i = e.target.closest('[data-noteinput]');
    if (!i) return;
    var btn = document.querySelector('[data-act="notesave"][data-id="' + i.dataset.noteinput + '"]');
    if (btn) btn.click();
  });

  el('tp-clear').addEventListener('click', function () {
    if (!state.tasks.some(function (t) { return t.done; })) { warn('완료함이 이미 비어 있습니다.'); return; }
    state.tasks = state.tasks.filter(function (t) { return !t.done; });
    render(); save(); syncNotifications();
  });

  el('tp-copy').addEventListener('click', function () {
    var open = state.tasks.filter(function (t) { return !t.done && (!t.due || dayDiff(t.due) >= 0); });
    var lines = open.map(function (t) {
      var late = t.due && dayDiff(t.due) > 0 ? ' (' + dayDiff(t.due) + '일 밀림)' : '';
      return '[' + t.prio + '] ' + t.title + ' \u2014 ' + fmtDue(t.due) + ' ' + (t.progress || 0) + '%' + late;
    });
    copyText('오늘 할 일\n' + (lines.length ? lines.join('\n') : '없음'), this, '목록');
  });

  el('tp-backup').addEventListener('click', function () {
    copyText(JSON.stringify(state.tasks), this, '백업');
  });

  el('tp-bell-toggle').addEventListener('click', async function () {
    var s = notifySet();
    if (!s.daily) {
      var ok = await askPermission();
      if (!ok) {
        warn('알림 권한이 없습니다. 폰 설정 → 앱 → 할일관리 → 알림에서 허용한 뒤 다시 켜주세요.');
        return;
      }
      s.daily = true;
    } else {
      s.daily = false;
    }
    s.time = el('tp-bell-time').value || '08:30';
    notifySave(s);
    renderBell();
    syncNotifications();
  });

  el('tp-bell-time').addEventListener('change', function () {
    var s = notifySet();
    s.time = this.value || '08:30';
    notifySave(s);
    renderBell();
    if (s.daily) syncNotifications();
  });

  el('tp-today-btn').addEventListener('click', function () {
    state.date = todayISO();
    state.calMonth = state.date.slice(0, 7);
    state.tab = 'day';
    syncTabs(); render();
  });

  state.date = todayISO();
  state.calMonth = state.date.slice(0, 7);
  load();
  render();
  renderBell();
  mirrorWidget();
  if (NATIVE) syncNotifications();
})();
</script>
</body>
</html>
